<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbefe9">
<title>responde ai</title>
<meta property="og:title" content="responde ai">
<meta name="apple-mobile-web-app-title" content="responde ai">
<link rel="stylesheet" href="style/style.css?v=dev">
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script defer src="js/main.js?v=dev"></script>
</head>
<body>
<div class="scenery" aria-hidden="true">
  <svg class="portrait" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <circle cx="330" cy="90" r="50" fill="#ffe9dc" opacity=".5"/>
    <circle cx="330" cy="90" r="32" fill="url(#sun)"/>
    <path d="M0 620C80 580 160 600 240 570C300 550 360 580 400 560V800H0Z" fill="#ecd9ef"/>
    <path d="M0 680C90 650 200 670 300 640C340 630 380 650 400 645V800H0Z" fill="#f6e5ed"/>
    <g class="clouds">
      <use href="#cloud" x="28" y="73" width="124" height="67"/>
      <use href="#cloud-wide" x="278" y="168" width="92" height="43"/>
      <use href="#cloud" x="44" y="262" width="72" height="39"/>
    </g>
  </svg>
  <svg class="landscape" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <circle cx="1400" cy="170" r="100" fill="#ffe9dc" opacity=".5"/>
    <circle cx="1400" cy="170" r="64" fill="url(#sun)"/>
    <path d="M0 690C220 630 470 680 760 640S1330 610 1600 650V900H0Z" fill="#ecd9ef"/>
    <path d="M0 765C300 720 610 765 900 735S1390 712 1600 745V900H0Z" fill="#f6e5ed"/>
    <g class="clouds">
      <use href="#cloud" x="70" y="150" width="190" height="102"/>
      <use href="#cloud-wide" x="400" y="82" width="128" height="60"/>
      <use href="#cloud" x="200" y="470" width="124" height="67"/>
      <use href="#cloud-wide" x="1110" y="140" width="180" height="84"/>
      <use href="#cloud" x="1330" y="400" width="116" height="62"/>
    </g>
  </svg>
  <svg class="defs" width="0" height="0">
    <symbol id="cloud" viewBox="2 4 108 58"><path d="M22 60A18 18 0 1 1 28.6 25.2A26 26 0 0 1 78.2 22.6A20 20 0 1 1 88 60Z" fill="#fffaf8" stroke="#ecdbe3" stroke-width="1.6" vector-effect="non-scaling-stroke"/></symbol>
    <symbol id="cloud-wide" viewBox="2 4 120 56"><path d="M18 58A14 14 0 1 1 21.9 30.6A22 22 0 0 1 57.5 14.7A20 20 0 0 1 93.6 29.8A16 16 0 1 1 104 58Z" fill="#fffaf8" stroke="#ecdbe3" stroke-width="1.6" vector-effect="non-scaling-stroke"/></symbol>
    <radialGradient id="sun"><stop offset=".55" stop-color="#fff1e4"/><stop offset="1" stop-color="#ffdcc6"/></radialGradient>
    <linearGradient id="heart0" x2="0" y2="1"><stop stop-color="#ffc2d1"/><stop offset="1" stop-color="#ec6f8f"/></linearGradient>
    <linearGradient id="heart1" x2="0" y2="1"><stop stop-color="#e6d8ff"/><stop offset="1" stop-color="#a68ae6"/></linearGradient>
    <linearGradient id="heart2" x2="0" y2="1"><stop stop-color="#ffdccd"/><stop offset="1" stop-color="#f2998b"/></linearGradient>
  </svg>
</div>

<main class="stage">
  <div class="hero">
    <div class="hero-circle" id="heroIconState">
      <svg viewBox="0 0 120 120" fill="none">
        <circle cx="60" cy="60" r="56" fill="#f1e6ea" stroke="#e0cdd6" stroke-width="1.5"/>
        <rect x="34" y="42" width="52" height="38" rx="12" fill="#fff" stroke="#d9c4cd" stroke-width="1.8"/>
        <circle cx="52" cy="60" r="4" fill="#5d5566"/>
        <circle cx="70" cy="60" r="4" fill="#5d5566"/>
        <path d="M54 71Q61 76 68 71" stroke="#5d5566" stroke-width="2" stroke-linecap="round"/>
        <path d="M86 55l14-8v26l-14-8Z" fill="#e7b7bd" stroke="#d9a3ab" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="hero-circle hero-emoji" id="heroEmojiState" hidden>😁</div>
  </div>

  <h1 id="title">FaceTime hoje?</h1>

  <div class="choices" id="choices">
    <button id="yes" class="shine">
      <span class="eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></span>
      Sim
    </button>
    <button id="no">Não</button>
  </div>

  <div class="success shine" id="success" hidden>
    <img src="img/facetime-gatinhos.jpg" alt="Chamada de FaceTime com gatinhos" decoding="async">
    <div class="reactions" aria-hidden="true"></div>
  </div>
</main>
</body>
</html>
