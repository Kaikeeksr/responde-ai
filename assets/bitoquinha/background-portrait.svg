<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800">
  <style>
    symbol * { vector-effect: non-scaling-stroke; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffd9df; stroke: #f0a9b8; }
    .paper { fill: #fff5f6; stroke: #f0a9b8; }
    .line { fill: none; stroke: #f0a9b8; }
    .warm { fill: #f7a3b6; stroke: #ee8ca3; }
    .shine { fill: #fff8f0; stroke: #f5c3a6; }
  </style>
  <defs>
    <linearGradient id="blush" x2="0" y2="1">
      <stop stop-color="#ffe6e9"/>
      <stop offset=".55" stop-color="#ffdde3"/>
      <stop offset="1" stop-color="#fcd3dc"/>
    </linearGradient>

    <symbol id="heart" viewBox="0 0 48 48">
      <path class="warm" d="M24 38.5S10 30.3 10 20.6a7.4 7.4 0 0 1 14-3.4 7.4 7.4 0 0 1 14 3.4c0 9.7-14 17.9-14 17.9Z"/>
      <path class="line" d="M16 20.5a3.6 3.6 0 0 1 3-3.4" style="stroke:#fff5f6"/>
    </symbol>
    <symbol id="lips" viewBox="0 0 48 48">
      <path class="warm" d="M7 24.5c4.5-6.2 8.6-9.3 11.8-9.3 2.2 0 3.8 1.2 5.2 2.7 1.4-1.5 3-2.7 5.2-2.7 3.2 0 7.3 3.1 11.8 9.3-4.3 6.3-10 10.3-17 10.3S11.3 30.8 7 24.5Z"/>
      <path class="line" d="M7 24.5c5.4 1.4 11 2.1 17 2.1s11.6-.7 17-2.1" style="stroke:#ee8ca3"/>
    </symbol>
    <symbol id="letter" viewBox="0 0 48 48">
      <rect class="paper" x="8" y="14" width="32" height="22" rx="3"/>
      <path class="line" d="M9 16l15 11 15-11"/>
      <path class="warm" d="M24 32.5s-5-2.9-5-6.3a2.6 2.6 0 0 1 5-1.1 2.6 2.6 0 0 1 5 1.1c0 3.4-5 6.3-5 6.3Z"/>
    </symbol>
    <symbol id="sparkle" viewBox="0 0 48 48">
      <path class="shine" d="M24 9c1.3 8.6 6.4 13.7 15 15-8.6 1.3-13.7 6.4-15 15-1.3-8.6-6.4-13.7-15-15 8.6-1.3 13.7-6.4 15-15Z"/>
    </symbol>
    <symbol id="hearts" viewBox="0 0 48 48">
      <path class="shape" d="M18 37s-9-5.3-9-11.5a4.8 4.8 0 0 1 9-2.2 4.8 4.8 0 0 1 9 2.2C27 31.7 18 37 18 37Z"/>
      <path class="warm" d="M32 24s-6.5-3.8-6.5-8.3a3.4 3.4 0 0 1 6.5-1.6 3.4 3.4 0 0 1 6.5 1.6c0 4.5-6.5 8.3-6.5 8.3Z"/>
    </symbol>
  </defs>

  <rect width="400" height="800" fill="url(#blush)"/>
  <g>
    <use href="#heart" x="40" y="80" width="40" height="40"/>
    <use href="#letter" x="180" y="80" width="40" height="40"/>
    <use href="#heart" x="320" y="80" width="40" height="40"/>
    <use href="#sparkle" x="-30" y="180" width="40" height="40"/>
    <use href="#lips" x="110" y="180" width="40" height="40"/>
    <use href="#lips" x="250" y="180" width="40" height="40"/>
    <use href="#sparkle" x="390" y="180" width="40" height="40"/>
    <use href="#hearts" x="40" y="280" width="40" height="40"/>
    <use href="#sparkle" x="180" y="280" width="40" height="40"/>
    <use href="#hearts" x="320" y="280" width="40" height="40"/>
    <use href="#letter" x="-30" y="380" width="40" height="40"/>
    <use href="#heart" x="110" y="380" width="40" height="40"/>
    <use href="#heart" x="250" y="380" width="40" height="40"/>
    <use href="#letter" x="390" y="380" width="40" height="40"/>
    <use href="#lips" x="40" y="480" width="40" height="40"/>
    <use href="#hearts" x="180" y="480" width="40" height="40"/>
    <use href="#lips" x="320" y="480" width="40" height="40"/>
    <use href="#heart" x="-30" y="580" width="40" height="40"/>
    <use href="#sparkle" x="110" y="580" width="40" height="40"/>
    <use href="#sparkle" x="250" y="580" width="40" height="40"/>
    <use href="#heart" x="390" y="580" width="40" height="40"/>
    <use href="#sparkle" x="40" y="680" width="40" height="40"/>
    <use href="#letter" x="180" y="680" width="40" height="40"/>
    <use href="#sparkle" x="320" y="680" width="40" height="40"/>
  </g>
</svg>
