    .hole { fill: #1c2553; stroke: #7d8fd4; }
    .perf { fill: #1c2553; stroke: none; }
    .line { fill: none; stroke: #7d8fd4; }
    .warm { fill: #f1d49c; stroke: #f8e5bf; }
    .lens-a { fill: #e38b7d; stroke: none; }
    .lens-b { fill: #6fb6c4; stroke: none; }
  </style>
  <defs>
